services:
  xiaozhi-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: xiaozhi-server-go:latest
    container_name: xiaozhi-server
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8000:8000"
    volumes:
      - xiaozhi_data:/app/data
    environment:
      - ENV=production
      - PORT=8080

volumes:
  xiaozhi_data:
    driver: local
