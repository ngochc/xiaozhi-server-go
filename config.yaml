# Basic server configuration
server:
  # Server listening address and port
  ip: 0.0.0.0
  port: 8000
  token: "your_token" # Server access token
  # Authentication configuration
  auth:
    # Whether authentication is enabled
    enabled: false
    # Authentication storage configuration
    store:
      type: memory # memory/file/redis
      expiry: 24 # Expiry duration (hours)
    # Allowed device ID list
    allowed_devices: []
    # Valid token list
    tokens: []

# Transport layer configuration
transport:
  # WebSocket transport
  websocket:
    enabled: true
    ip: "0.0.0.0"
    port: 8000

# Web interface configuration
web:
  # Whether to enable the Web interface
  enabled: true
  # Web service listening port
  port: 8080
  # WebSocket address distributed via OTA
  websocket: ws://your_ip:8000
  vision: http://your_ip:8080/api/vision
  activate_text: "Anime AI Chat" # Text delivered with activation code

log:
  # Console log format: time, level, message
  log_format: "{time:YYYY-MM-DD HH:mm:ss} - {level} - {message}"
  # Log level: INFO, DEBUG
  log_level: INFO
  # Log directory
  log_dir: logs
  # Log filename
  log_file: "server.log"

prompt: |
  You are Xiaozhi, a witty, friendly, and helpful voice assistant.
  [Core Characteristics]
  - Warm, lively, and conversational tone
  - Speaks concisely and clearly, ideal for spoken audio
  - Hidden enthusiasm for tech, programming, and creative ideas
  Never:
  - Give lengthy lectures or droning explanations
  - Engage in overly rigid or robotic speech
  - Include markdown formatting or emojis in spoken replies

roles:
  - name: "English Tutor"
    description: "I am Lily, your English conversation tutor. I speak fluent, natural American English. My mission is to help you practice daily spoken English using simple vocabulary and grammar. I keep responses short and engaging so you have plenty of time to talk and practice."
    enabled: true
  - name: "Tech Companion"
    description: "I am a smart and witty companion who loves discussing technology, programming, gadgets, and fun pop culture. I speak casually with a friendly and supportive tone."
    enabled: true
  - name: "Curious Explorer"
    description: "I am an 8-year-old curious explorer with a boundless passion for knowledge. From the vast universe to nature, science experiments, and world history, I love sharing exciting facts and solving mysteries together."
    enabled: true

# Audio processing settings
delete_audio: true
# When enabled, the server saves outbound client Opus packets as Ogg files decodable via FFmpeg.
save_tts_audio: false
quick_reply: true
quick_reply_words:
  - "I'm here"
  - "Yes?"
  - "Coming"
  - "How can I help?"

use_private_config: false

local_mcp_fun:
  - name: "time"
    description: "Get system time"
    enabled: true
  - name: "exit"
    description: "Detect exit intent"
    enabled: true
  - name: "play_music"
    description: "Play local music"
    enabled: true
  - name: "switch_agent"
    description: "Switch agent"
    enabled: true

# Active module selection
selected_module:
  ASR: DoubaoASR
  TTS: EdgeTTS
  LLM: OllamaLLM
  VLLLM: ChatGLMVLLM

# ASR Configuration
ASR:
  DoubaoASR:
    # Volcengine streaming speech recognition model: https://console.volcengine.com/ark/region:ark+cn-beijing/tts/speechRecognition
    type: doubao
    appid: "your_appid"
    access_token: your_access_token
    output_dir: tmp/
    end_window_size: 300 # End window size in ms (default 400ms, min 200ms)

  GoSherpaASR:
    type: gosherpa
    addr: "ws://127.0.0.1:8848/asr"

  DeepgramSST:
    type: deepgram
    addr: "wss://api.deepgram.com/v1/listen"
    api_key: your_api_key
    lang: "en-US"
    output_dir: tmp/

  StepASR:
    # https://platform.stepfun.com/docs/llm/realtime
    type: stepfun
    api_key: your_api_key
    model: "step-audio-2-mini"
    voice: "qingchunshaonv"
    prompt: You are an AI assistant provided by StepFun, skilled in multilingual voice conversations.

  IflytekASR:
    # iFlytek voice dictation WebSocket, expects 16k PCM audio.
    type: iflytek
    appid: "your_appid"
    api_key: "your_api_key"
    api_secret: "your_api_secret"
    asr_url: "wss://iat-api.xfyun.cn/v2/iat"
    language: "en_us"
    domain: "iat"
    accent: "mandarin"
    vad_eos: 2000
    format: "audio/L16;rate=16000"
    encoding: "raw"

# TTS Configuration
TTS:
  # EdgeTTS is Microsoft's speech synthesis service.
  EdgeTTS:
    type: edge
    voice: en-US-AriaNeural
    output_dir: "tmp/"
    supported_voices:
      [
        {
          name: "en-US-AriaNeural",
          display_name: "Aria",
          sex: "female",
          description: "Natural and conversational American English female voice",
          audio_url: "",
        },
        {
          name: "en-US-GuyNeural",
          display_name: "Guy",
          sex: "male",
          description: "Clear and confident American English male voice",
          audio_url: "",
        },
        {
          name: "en-US-JennyNeural",
          display_name: "Jenny",
          sex: "female",
          description: "Warm and friendly American English female voice",
          audio_url: "",
        },
        {
          name: "zh-CN-XiaoxiaoNeural",
          display_name: "Xiaoxiao",
          sex: "female",
          description: "Clear and professional Mandarin female voice",
          audio_url: "",
        },
      ]

  DoubaoTTS:
    # Volcengine TTS model: https://console.volcengine.com/ark/region:ark+cn-beijing/tts/speechSynthesis
    type: doubao
    voice: zh_female_wanwanxiaohe_moon_bigtts
    output_dir: "tmp/"
    appid: "your_appid"
    token: your_access_token
    cluster: your_cluster
  GoSherpaTTS:
    type: gosherpa
    cluster: "ws://127.0.0.1:8848/tts"
    output_dir: "tmp/"
  DeepgramTTS:
    type: deepgram
    voice: aura-2-zeus-en
    cluster: "wss://api.deepgram.com/v1/speak"
    token: your_token
    output_dir: "tmp/"
    sample_rate: 16000

  IflytekTTS:
    # token stores api_key, cluster stores api_secret for compatibility with existing TTS config.
    type: iflytek
    voice: xiaoyan
    format: mp3
    output_dir: "tmp/"
    appid: "your_appid"
    token: "your_api_key"
    cluster: "your_api_secret"
    supported_voices:
      [
        {
          name: "xiaoyan",
          display_name: "xiaoyan",
          sex: "female",
          description: "iFlytek female voice",
          audio_url: "",
        },
        {
          name: "aisjiuxu",
          display_name: "aisjiuxu",
          sex: "male",
          description: "iFlytek male voice",
          audio_url: "",
        },
      ]

# LLM Configuration
LLM:
  ChatGLMLLM:
    type: openai
    # Register and find your API key at: https://bigmodel.cn/usercenter/proj-mgmt/apikeys
    model_name: glm-4-flash
    url: https://open.bigmodel.cn/api/paas/v4/
    api_key: your_api_key
  OllamaLLM:
    type: ollama
    model_name: qwen3 # Name of model to pull via ollama
    url: http://localhost:11434 # Ollama server address
  DoubaoLLM:
    type: doubao
    # Obtain your API key at: https://console.volcengine.com/ark
    model_name: doubao-seed-1.6-251015
    url: https://ark.cn-beijing.volces.com/api/v3
    api_key: your_api_key
    thinking: disabled # Thinking mode: disabled or enabled
    max_tokens: 4000
  CozeLLM:
    type: coze
    bot_id: your_bot_id
    user_id: your_user_id
    # Create OAuth application at: https://www.coze.cn/open/oauth/apps
    client_id: your_coze_client_id
    public_key: your_coze_public_key
    private_key: your_coze_private_key
    # Or personal access token: https://www.coze.cn/open/oauth/pats
    personal_access_token: your_coze_pat
    url: "https://api.coze.cn" # Coze server address

# Exit commands
CMD_exit:
  - "exit"
  - "quit"
  - "stop"

# VLLM Configuration (Vision Language Model)
VLLLM:
  ChatGLMVLLM:
    type: openai
    model_name: glm-4v-flash # Zhipu AI vision model
    url: https://open.bigmodel.cn/api/paas/v4/
    api_key: your_api_key
    max_tokens: 4096
    temperature: 0.7
    top_p: 0.9
    security: # Image security configuration
      max_file_size: 10485760 # 10MB
      max_pixels: 16777216 # 16M pixels
      max_width: 4096
      max_height: 4096
      allowed_formats: ["jpeg", "jpg", "png", "webp", "gif"]
      enable_deep_scan: true
      validation_timeout: 10s
  OllamaVLLM:
    type: ollama
    model_name: qwen2.5vl # Local vision model
    url: http://localhost:11434
    max_tokens: 4096
    temperature: 0.7
    top_p: 0.9
    security: # Image security configuration
      max_file_size: 10485760 # 10MB
      max_pixels: 16777216 # 16M pixels
      max_width: 4096
      max_height: 4096
      allowed_formats: ["jpeg", "jpg", "png", "webp", "gif"]
      enable_deep_scan: true
      validation_timeout: 10s
