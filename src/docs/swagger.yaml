basePath: /api
definitions:
  ota.ErrorResponse:
    properties:
      message:
        example: Missing device-id
        type: string
      success:
        example: false
        type: boolean
    type: object
  ota.OtaFirmwareResponse:
    properties:
      firmware:
        properties:
          url:
            example: /ota_bin/1.0.3.bin
            type: string
          version:
            example: 1.0.3
            type: string
        type: object
      server_time:
        properties:
          timestamp:
            example: 1688443200000
            type: integer
          timezone_offset:
            example: 480
            type: integer
        type: object
      websocket:
        properties:
          url:
            example: wss://example.com/ota
            type: string
        type: object
    type: object
  ota.OtaRequest:
    properties:
      application:
        properties:
          version:
            example: 1.0.0
            type: string
        type: object
    type: object
host: localhost:8080
info:
  contact: {}
  description: Xiaozhi Server, including OTA, Vision, and Management APIs
  title: Xiaozhi Server API Documentation
  version: "1.0"
paths:
  /ota/:
    get:
      description: Get OTA service status and WebSocket address for device query
      produces:
      - text/plain
      responses:
        "200":
          description: 'OTA interface is running, websocket address: ws://...'
          schema:
            type: string
      summary: Get OTA status
      tags:
      - OTA
    options:
      consumes:
      - '*/*'
      description: Handle OPTIONS preflight request for OTA endpoints, returns 200
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: OTA preflight request
      tags:
      - OTA
    post:
      consumes:
      - application/json
      description: Upload device info to get latest firmware version and download URL
      parameters:
      - description: Device ID
        in: header
        name: device-id
        required: true
        type: string
      - description: Request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/ota.OtaRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ota.OtaFirmwareResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ota.ErrorResponse'
      summary: Upload device info to get latest firmware
      tags:
      - OTA
  /ota_bin/{filename}:
    get:
      description: Download OTA firmware by filename
      parameters:
      - description: Firmware filename
        in: path
        name: filename
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: File stream
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ota.ErrorResponse'
      summary: Download OTA firmware file
      tags:
      - OTA
swagger: "2.0"
